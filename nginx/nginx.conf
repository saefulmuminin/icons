# nginx in front of the Next.js server.
#
# It is here to do the two things a Node process should not: hold the public
# port, and serve the immutable build output straight off disk without waking
# the application for every asset.

upstream iconz_app {
    server iconz-fe:3000;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    # The build stamps a hash into every one of these filenames, so a file at
    # a given name can never change. A year is the longest the spec allows.
    location /_next/static/ {
        proxy_pass http://iconz_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Never cached: a health check answered from cache reports the cache.
    location /api/health {
        proxy_pass http://iconz_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        add_header Cache-Control "no-store";
    }

    location / {
        proxy_pass http://iconz_app;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_read_timeout 60s;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/xml;

    client_max_body_size 8m;
    server_tokens off;
}
